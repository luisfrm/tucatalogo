name: Deploy prod

# Prod-only: cada push a la línea principal despliega de forma automática.
# No hay GitHub Environments ni aprobaciones. Las credenciales son repository
# secrets (`CLOUDFLARE_API_TOKEN`, `CLOUDFLARE_ACCOUNT_ID`) y `SMOKE_STORE_HOST`
# es una repository variable (Settings → Secrets and variables → Actions).
# Este workflow es **solo deploy**: `wrangler deploy` no aplica secretos, así que
# los 5 runtime secrets del api se sincronizan a mano con `sync-secrets.yml`.
# Un commit cuyo mensaje lleve `[skip ci]` no dispara este workflow.
on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Un solo deploy a la vez en toda la cuenta.
concurrency:
  group: deploy-cloud
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-prod:
    name: Deploy prod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check Worker configs (A1)
        run: node packages/config/scripts/check-worker-configs.mjs

      - name: Audit (high/critical)
        run: pnpm audit --prod --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: D1 migrations (prod)
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply tucatalogo-prod --remote --env prod

      - name: Deploy api (prod)
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env prod

      - name: Deploy web (prod)
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CLOUDFLARE_ENV=prod pnpm build
          pnpm exec wrangler deploy --env prod

      - name: Deploy commercial (prod)
        working-directory: apps/commercial
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CLOUDFLARE_ENV=prod pnpm build
          pnpm exec wrangler deploy --env prod

      - name: Deploy console (prod)
        working-directory: apps/console
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CLOUDFLARE_ENV=prod pnpm build
          pnpm exec wrangler deploy --env prod

      # El api no tiene host público (A1): /health solo es alcanzable por service
      # binding. Aquí se comprueba el deployment activo y que D1 remoto responde.
      - name: API internal check (prod)
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm exec wrangler deployments status --name tucatalogo-api-prod --env prod
          pnpm exec wrangler d1 execute tucatalogo-prod --remote --env prod --yes \
            --command "SELECT 1 AS ok"

      - name: Smoke prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Repository variable (Settings → Secrets and variables → Actions →
          # Variables): tienda de bajo riesgo para el smoke del storefront
          # (p. ej. "demo.luisrivas.site"). Sin ella no hay host de web que
          # probar: el step falla de forma visible.
          SMOKE_STORE_HOST: ${{ vars.SMOKE_STORE_HOST }}
        run: |
          set -euo pipefail

          if [ -z "${SMOKE_STORE_HOST:-}" ]; then
            echo "Falta SMOKE_STORE_HOST (tienda de smoke del storefront)." >&2
            exit 1
          fi

          if [[ "$SMOKE_STORE_HOST" == *"://"* || "$SMOKE_STORE_HOST" == */* ]]; then
            echo "SMOKE_STORE_HOST debe ser un host sin esquema ni ruta." >&2
            exit 1
          fi

          smoke() {
            url="$1"
            for attempt in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
              if [ "$code" = "200" ]; then
                echo "OK  $url"
                return 0
              fi
              echo "esperando $url (HTTP ${code:-error}) intento $attempt/12"
              sleep 5
            done
            echo "FAIL $url" >&2
            return 1
          }

          smoke "https://tucatalogo.luisrivas.site/health"
          smoke "https://console-tucatalogo.luisrivas.site/health"
          smoke "https://${SMOKE_STORE_HOST}/health"
