name: Sync worker secrets

# Sincronización **manual** de los 4 runtime secrets del worker `api` en prod.
#
# Por qué existe: `wrangler deploy` NO aplica secretos. Los secretos del worker
# se cargan una vez y sobreviven a los deploys, pero rotarlos o recrear el worker
# exige `wrangler secret put`. Este workflow hace exactamente eso, a demanda.
#
# `INIT_TOKEN` ya no forma parte del contrato: `/init` se protege con Cloudflare
# Access delante de `console.tucatalogo.live/init`. Si un worker antiguo aún
# conserva ese secret huérfano, es inofensivo (ningún código lo lee) y se borra
# a mano: `cd apps/api && pnpm exec wrangler secret delete INIT_TOKEN --env prod`.
#
# Dónde viven los valores: en el GitHub **Environment `prod`** como Environment
# secrets (Settings → Environments → prod → Environment secrets). Ese Environment
# no tiene reglas de protección ni revisores: el job corre en cuanto se despacha.
# `CLOUDFLARE_API_TOKEN` y `CLOUDFLARE_ACCOUNT_ID` siguen siendo Repository
# secrets y son accesibles desde este job.
#
# Ojo con los dos "prod": `target: prod` es el `--env prod` de **Wrangler**
# (`env.prod` del `wrangler.jsonc`); el `environment: prod` de abajo es el
# Environment de **GitHub** del que se leen los secretos.
#
# Los valores nunca se imprimen: solo se canalizan por stdin a wrangler, que
# únicamente reporta el nombre del secreto.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Entorno de destino (se pasa como `--env` de Wrangler)."
        type: choice
        options:
          - prod
        default: prod
        required: true
      confirm:
        description: "Escribe sync para confirmar la escritura de secretos en el worker."
        type: string
        required: true

concurrency:
  group: sync-secrets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-secrets:
    name: Sync api secrets (${{ inputs.target }})
    # Salvaguarda: un despacho accidental no debe sobrescribir secretos.
    if: github.event.inputs.confirm == 'sync'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Los 4 valores llegan como Environment secrets de `prod`. El worker debe
    # existir: lanza este workflow después del primer deploy del api.
    environment:
      name: prod
    defaults:
      run:
        # wrangler se ejecuta donde vive su `wrangler.jsonc`.
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        # El workspace se instala desde la raíz del monorepo.
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile

      - name: Sync api secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET_STORE: ${{ secrets.BETTER_AUTH_SECRET_STORE }}
          BETTER_AUTH_SECRET_CONSOLE: ${{ secrets.BETTER_AUTH_SECRET_CONSOLE }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          if [ -z "${TARGET:-}" ]; then
            echo "Falta el input target." >&2
            exit 1
          fi

          put() {
            name="$1"
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "Falta el Environment secret $name (Environment prod): no se escribe ningún secreto." >&2
              exit 1
            fi
            printf '%s' "$value" | pnpm exec wrangler secret put "$name" --env "$TARGET"
          }

          put BETTER_AUTH_SECRET_STORE
          put BETTER_AUTH_SECRET_CONSOLE
          put RESEND_API_KEY
          put TURNSTILE_SECRET_KEY

          echo "Secretos sincronizados en el worker api (--env $TARGET)."
