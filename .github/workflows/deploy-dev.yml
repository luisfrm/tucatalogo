name: Deploy dev

on:
  push:
    branches: [main]

# Un solo deploy a la vez en toda la cuenta (dev y prod comparten grupo).
concurrency:
  group: deploy-cloud
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-dev:
    name: Deploy dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Environment con los secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID.
    environment:
      name: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check Worker configs (A1)
        run: node packages/config/scripts/check-worker-configs.mjs

      - name: Audit (high/critical)
        run: pnpm audit --prod --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: D1 migrations (dev)
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply tucatalogo-dev --remote --env dev

      - name: Deploy api (dev)
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env dev

      - name: Deploy web (dev)
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # El entorno del plugin se elige al construir (rutas, bindings y vars).
          CLOUDFLARE_ENV=dev pnpm build
          pnpm exec wrangler deploy --env dev

      - name: Deploy commercial (dev)
        working-directory: apps/commercial
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CLOUDFLARE_ENV=dev pnpm build
          pnpm exec wrangler deploy --env dev

      - name: Deploy console (dev)
        working-directory: apps/console
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CLOUDFLARE_ENV=dev pnpm build
          pnpm exec wrangler deploy --env dev

      # El api no tiene host público (A1): /health solo es alcanzable por service
      # binding. Aquí se comprueba el deployment activo y que D1 remoto responde.
      - name: API internal check (dev)
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm exec wrangler deployments status --name tucatalogo-api-dev --env dev
          pnpm exec wrangler d1 execute tucatalogo-dev --remote --env dev --yes \
            --command "SELECT 1 AS ok"

      - name: Smoke dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          SUBDOMAIN=$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | jq -r '.result.subdomain')

          if [ -z "$SUBDOMAIN" ] || [ "$SUBDOMAIN" = "null" ]; then
            echo "No se pudo obtener el subdominio workers.dev de la cuenta." >&2
            exit 1
          fi

          smoke() {
            url="$1"
            for attempt in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
              if [ "$code" = "200" ]; then
                echo "OK  $url"
                return 0
              fi
              echo "esperando $url (HTTP ${code:-error}) intento $attempt/12"
              sleep 5
            done
            echo "FAIL $url" >&2
            return 1
          }

          smoke "https://tucatalogo-web-dev.${SUBDOMAIN}.workers.dev/health"
          smoke "https://tucatalogo-commercial-dev.${SUBDOMAIN}.workers.dev/health"
          smoke "https://tucatalogo-console-dev.${SUBDOMAIN}.workers.dev/health"
